[project]
name = "musigree"
version = "1.0.40"
description = "Interactive visualization of the Discogs database"
authors = [
    { name = "Andy Radburn", email = "andy.radburn@outlook.com" },
    { name = "Josiah Wolf Oberholtzer", email = "josiah.oberholtzer@gmail.com" },
]
license = { text = "MIT" }
requires-python = "==3.13.7"
readme = "README.md"

dependencies = [
    "fastapi==0.121.1",
    "sqlalchemy[asyncio]==2.0.44",
    "psycopg[binary]==3.2.12",
    "aiosqlite==0.21.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0",
    "fakeredis==2.32.1",
    "luigi==3.6.0",
    "sortedcontainers==2.4.0",
    "deepdiff==8.6.1",
    "RapidFuzz==3.14.3",
    "retrying==1.4.2",
    "requests==2.32.5",
    "python-dateutil==2.9.0.post0",
    "toolz==1.1.0",
    "Unidecode==1.4.0",
    "python-dotenv==1.2.1",
    "gunicorn==23.0.0",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "asyncio-atexit==1.0.1",
    "asyncstdlib==3.13.1",
    "types-python-dateutil>=2.9.0.20251108",
]

[project.urls]
Repository = "https://github.com/aradburn/musigree"
Homepage = "https://musigree.com"
Issues = "https://github.com/aradburn/musigree/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"
addopts = "-ra -q -s"
testpaths = [
    "tests/unit",
    "tests/integration",
]
norecursedirs = "tests/performance"

[tool.uv]
dev-dependencies = [
    "pg-temp==0.9.1",
    "pytest==8.4.2",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "mypy==1.18.2",
    "memray==1.19.1",
    "pytest-memray==1.8.0",
    "sortedcontainers-stubs==2.4.3",
    "types-requests==2.32.4.20250913",
    "types-python-dateutil==2.9.0.20251108",
    "locust==2.40.5",
    "ruff==0.14.4",
    "hatchling==1.27.0",
    "yappi==1.7.3",
    "pre-commit==4.4.0",
]
reinstall-package = ["musigree"]

[tool.mypy]
python_version = "3.13"
#strict = true                    # Enable more checks
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = false   # Display error for all missing imports

[tool.ruff]
line-length = 100                # Line length for formatting
target-version = "py313"         # Target Python version

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
extend-select = ["B"]
fixable = ["ALL"]                # Allow automatic fixes for all fixable issues
