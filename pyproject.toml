[project]
name = "musigree"
version = "1.0.79"
description = "Interactive visualization of the Discogs database"
authors = [
    { name = "Andy Radburn", email = "andy.radburn@outlook.com" },
    { name = "Josiah Wolf Oberholtzer", email = "josiah.oberholtzer@gmail.com" },
]
license = { text = "MIT" }
requires-python = "==3.13.11"
readme = "README.md"

dependencies = [
    "fastapi==0.136.3",
    "Secweb==1.30.10",
    "sqlalchemy[asyncio]==2.0.50",
    "psycopg[binary]==3.3.4",
    "aiosqlite==0.22.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "redis[hiredis]==7.3.0",
    "fakeredis==2.36.0",
    "tornado==6.5.6",
    "luigi==3.6.0",
    "sortedcontainers==2.4.0",
    "deepdiff==8.6.1",
    "RapidFuzz==3.14.5",
    "retrying==1.4.2",
    "urllib3==2.7.0",
    "requests==2.34.2",
    "python-dateutil==2.9.0.post0",
    "toolz==1.1.0",
    "Unidecode==1.4.0",
    "python-dotenv==1.2.2",
    "gunicorn==26.0.0",
    "uvicorn==0.48.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "asyncio-atexit==1.0.1",
    "asyncstdlib==3.14.0",
    "types-python-dateutil>=2.9.0.20260518",
]

[project.urls]
Repository = "https://github.com/aradburn/musigree"
Homepage = "https://musigree.com"
Issues = "https://github.com/aradburn/musigree/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"
addopts = "-ra -q -s"
filterwarnings = [
    "ignore:coroutine .* was never awaited:RuntimeWarning",
]
testpaths = [
    "tests/unit",
    "tests/integration",
]
norecursedirs = "tests/performance"

[dependency-groups]
dev = [
    "pg-temp==0.9.1",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.1.0",
    "memray==1.19.3",
    "pytest-memray==1.8.0",
    "sortedcontainers-stubs==2.4.3",
    "types-requests==2.33.0.20260518",
    "locust==2.44.0",
    "ruff==0.15.15",
    "hatchling==1.29.0",
    "yappi==1.7.6",
    "pre-commit==4.4.0",
    "playwright==1.58.0",
    "pytest-playwright-asyncio==0.7.2",
    "asgi-lifespan==2.1.0",
]
reinstall-package = ["musigree"]

[tool.mypy]
python_version = "3.13"
#strict = true                    # Enable more checks
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = false   # Display error for all missing imports
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100                # Line length for formatting
target-version = "py313"         # Target Python version

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
extend-select = ["B"]
fixable = ["ALL"]                # Allow automatic fixes for all fixable issues
