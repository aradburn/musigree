[project]
name = "musigree"
version = "1.0.0"
description = "Interactive visualization of the Discogs database"
authors = [
    { name = "Andy Radburn", email = "andy.radburn@outlook.com" },
    { name = "Josiah Wolf Oberholtzer", email = "josiah.oberholtzer@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"  # Changed to a more general requirement.
readme = "README.md"

dependencies = [
    "fastapi~=0.115.12",
    "SQLAlchemy~=2.0.41",
    "psycopg2~=2.9.10",
    "pydantic~=2.11.5",
    "pydantic-settings~=2.9.1",
    "luigi~=3.6.0",
    "sortedcontainers~=2.4.0",
    "deepdiff~=8.5.0",
    "RapidFuzz~=3.12.2",
    "retrying~=1.3.4",
    "requests~=2.32.3",
    "python-dateutil~=2.9.0.post0",
    "toolz~=1.0.0",
    "Unidecode~=1.3.8",
    "python-dotenv~=1.1.0",
    "fakeredis~=2.29.0",
    "uvicorn~=0.34.3",
    "httpx~=0.28.1",
    "jinja2~=3.1.6",
]

[project.urls]
Repository = "https://github.com/aradburn/musigree"
Homepage = "https://github.com/aradburn/musigree"
Issues = "https://github.com/aradburn/musigree/issues"

[tool.pdm.build]
includes = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pg-temp>=0.9.1,<1.0.0",
    "fakeredis>=2.26.1,<3.0.0",
    "pytest~=8.4.0",
    "pytest-mock~=3.14.1",
    "pytest-asyncio~=1.0.0",
    "mypy~=1.16.0",
    "memray>=1.17.2,<2.0.0",
    "pytest-memray>=1.7.0,<2.0.0",
]
