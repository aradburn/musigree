# Smoke-test the production image against the local SQLite runtime database
# and a Redis container on this stack's private network.
# SqliteProductionConfiguration resolves the runtime database to
# ROOT_DIR/../data/musigree_runtime_prod.db, which is /data/musigree_runtime_prod.db
# when the app lives in /app.
#
# Redis keeps the cache in memory only, capped at 512MB, and evicts the least
# recently used keys when that cap is reached. It is not published on a host port.
#
# The root filesystem is read-only. Writable scratch is a noexec tmpfs on
# /tmp and /var/tmp. Gunicorn heartbeats use the default /dev/shm tmpfs
# (--worker-tmp-dir in the image).
services:
  musigree:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    init: true
    user: "65532:65532"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: default
      REDIS_PASSWORD: redis_dev
    volumes:
      - type: bind
        source: ./runtime_database/musigree_runtime_dev.db
        target: /data/musigree_runtime_prod.db
        read_only: true
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: redis_dev
    command:
      - redis-server
      - --requirepass
      - redis_dev
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
