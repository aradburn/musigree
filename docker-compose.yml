# Coolify Git Docker Compose build pack.
# https://coolify.io/docs/applications/builds/docker-compose
#
# Coolify generates SERVICE_URL_MUSIGREE_5000 and routes public HTTPS to
# port 5000. REDIS_HOST, REDIS_PORT, REDIS_USERNAME, and REDIS_PASSWORD
# come from the values already set in the Coolify environment variables.
# Connect this resource to the predefined network so it can reach the
# standalone Redis database.
#
# The runtime SQLite file is /data/musigree_runtime_prod.db inside the
# container. That path is the host directory /home/musigree/data, mounted
# read-only. The database file must be world-readable; the process runs as
# uid 65532.

services:
  musigree:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    init: true
    user: "65532:65532"
    environment:
      SERVICE_URL_MUSIGREE_5000: /
      REDIS_HOST: ${REDIS_HOST:?}
      REDIS_PORT: ${REDIS_PORT:?}
      REDIS_USERNAME: ${REDIS_USERNAME:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - /home/musigree/data:/data:ro
