# Coolify Git Docker Compose build pack.
# https://coolify.io/docs/applications/builds/docker-compose
#
# Coolify generates SERVICE_URL_MUSIGREE_5000 and routes public HTTPS to
# port 5000. It generates SERVICE_PASSWORD_REDIS once and reuses that value
# for the Redis service and the application. REDIS_USERNAME defaults to
# Coolify's Redis username, "default".
#
# To use a standalone Coolify Redis database instead of the redis service,
# connect this resource to the predefined network, set REDIS_HOST to that
# database's UUID, and set REDIS_PASSWORD to its REDIS_PASSWORD.
#
# The runtime SQLite file must exist in the musigree-runtime volume as
# /data/musigree_runtime_prod.db and be world-readable. The app opens it
# read-only.

services:
  musigree:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    init: true
    user: "65532:65532"
    environment:
      SERVICE_URL_MUSIGREE_5000: /
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - type: volume
        source: musigree-runtime
        target: /data
        read_only: true
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    command:
      - redis-server
      - --requirepass
      - ${SERVICE_PASSWORD_REDIS}
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  musigree-runtime:
  redis-data:
