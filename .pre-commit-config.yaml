repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v6.0.0  # the release, git tag, or commit you want to use
        hooks:
            -   id: check-toml
            -   id: check-yaml
            -   id: end-of-file-fixer
            -   id: trailing-whitespace
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        # Ruff version.
        rev: v0.14.1
        hooks:
            # Run the linter.
            -   id: ruff-check
            # Run the formatter.
            -   id: ruff-format
