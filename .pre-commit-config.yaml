# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
minimum_pre_commit_version: "4.6.2"
default_language_version:
    python: python3.14
# Install both commit and push hooks. The release hook only runs on pre-push.
default_install_hook_types: [pre-commit, pre-push]
# Hooks without an explicit stages list run on commit only.
default_stages: [pre-commit]
repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v6.0.0
        hooks:
            -   id: check-added-large-files
            -   id: check-case-conflict
            -   id: check-json
            -   id: check-merge-conflict
            -   id: check-toml
            -   id: check-yaml
            -   id: detect-private-key
            -   id: end-of-file-fixer
                files: ^musigree/
                types: [file, python]
            -   id: mixed-line-ending
            -   id: trailing-whitespace
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        # Keep in sync with the ruff pin in pyproject.toml.
        rev: v0.16.8
        hooks:
            -   id: ruff-check
                files: ^musigree/
                args: [--fix]
            -   id: ruff-format
                files: ^musigree/
    -   repo: https://github.com/astral-sh/uv-pre-commit
        # uv version.
        rev: 0.12.18
        hooks:
            -   id: uv-lock
    -   repo: local
        hooks:
            -   id: release
                name: release and bump version
                entry: ./release.sh --force patch
                language: unsupported_script
                pass_filenames: false
                stages: [pre-push]
                verbose: true
