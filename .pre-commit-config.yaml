# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
    python: python3.13
repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v6.0.0  # the release, git tag, or commit you want to use
        hooks:
            -   id: check-toml
            -   id: check-yaml
            -   id: end-of-file-fixer
                files: ^musigree/
                types: [ file, python ]
            -   id: trailing-whitespace
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        # Ruff version.
        rev: v0.14.1
        hooks:
            # Run the linter.
            -   id: ruff-check
            # Run the formatter.
            -   id: ruff-format
    -   repo: https://github.com/astral-sh/uv-pre-commit
        # uv version.
        rev: 0.9.3
        hooks:
            -   id: uv-lock
    -   repo: https://github.com/thoughtworks/talisman
        rev: 'v1.37.0'  # Update me!
        hooks:
            # both pre-commit and pre-push supported
            # -   id: talisman-push
            -   id: talisman-commit
    -   repo: local
        hooks:
            -   id: release
                name: release and bump version
                entry: ./release.sh --force patch
                language: python
                files: ''
                exclude: (.pre-commit-config.yaml)|(.github/)
                verbose: true
