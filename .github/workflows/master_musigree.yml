# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - musigree

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Python version
                uses: actions/setup-python@v1
                with:
                    python-version: '3.11'

            -   name: Create and start virtual environment
                run: |
                    python -m venv venv
                    source venv/bin/activate

            -   name: Install dependencies
                run: pip install -r requirements.txt

            # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

            -   name: Zip artifact for deployment
                run: zip release.zip ./* -r

            -   name: Upload artifact for deployment jobs
                uses: actions/upload-artifact@v3
                with:
                    name: python-app
                    path: |
                        release.zip
                        !venv/

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: 'Production'
            url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        permissions:
            id-token: write #This is required for requesting the JWT

        steps:
            -   name: Download artifact from build job
                uses: actions/download-artifact@v3
                with:
                    name: python-app

            -   name: Unzip artifact for deployment
                run: unzip release.zip


            -   name: Login to Azure
                uses: azure/login@v1
                with:
                    client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AFA0428178654FFF88D4D23C689A4FDC }}
                    tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_81EE7103E8CE4096891F68A2A40B4FC0 }}
                    subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C31146096C504BCEB884DAA55187D86D }}

            -   name: 'Deploy to Azure Web App'
                uses: azure/webapps-deploy@v2
                id: deploy-to-webapp
                with:
                    app-name: 'musigree'
                    slot-name: 'Production'
          
